services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: ci-only-password
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "todo", "-d", "todo"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: todo-api:jenkins-${BUILD_NUMBER:?BUILD_NUMBER is required}
    environment:
      HTTP_ADDR: "0.0.0.0:8000"
      DATABASE_URL: "postgres://todo:ci-only-password@db:5432/todo?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

  check:
    image: curlimages/curl:8.12.1
    entrypoint: ["curl"]